[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphspec"
version = "0.1.0"
description = "Declare, render, validate, diff, trace and scaffold agent-graph topologies for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Libros de ia.com" }]
dependencies = ["pyyaml>=6.0"]
keywords = ["agents", "graphs", "claude-code", "topology", "validation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Homepage = "https://github.com/librosdeia/graphspec"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
graphspec = "graphspec.cli:main"

[tool.setuptools]
packages = ["graphspec", "graphspec.rules", "graphspec.trace"]

[tool.setuptools.package-data]
graphspec = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
